name: ConexionES CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [mysql:8.4, mariadb:11.4]
    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: test-root-only
          MYSQL_USER: conexiones
          MYSQL_PASSWORD: test-only
          MYSQL_DATABASE: conexiones_test
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-only || mariadb-admin ping -h 127.0.0.1 -uroot -ptest-root-only" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: mysql://conexiones:test-only@127.0.0.1:3306/conexiones_test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
