services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conexiones
      POSTGRES_USER: conexiones
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conexiones}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conexiones"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  pgdata:
