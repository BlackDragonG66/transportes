services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: conexiones
      MARIADB_USER: conexiones
      MARIADB_PASSWORD: local-dev-only
      MARIADB_ROOT_PASSWORD: local-root-only
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10
  mail:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  mysqldata:
